services:
  log-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-erp-suite}-log-service
    user: "1001:1001"
    ports:
      - "${LOG_SERVICE_HTTP_PORT:-8001}:8001"
      - "${LOG_SERVICE_GRPC_PORT:-50052}:50052"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-erp_system}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_MAX_OPEN_CONNS: 5
      DB_MAX_IDLE_CONNS: 2
      KAFKA_BROKERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      AUTH_SERVICE_GRPC_HOST: auth-service
      AUTH_SERVICE_GRPC_PORT: ${AUTH_SERVICE_GRPC_PORT:-50051}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PORT: 8001
      GRPC_PORT: 50052
      GOGC: 100
      GOMEMLIMIT: 256MiB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 90s
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - erp-network
    profiles:
      - full-stack

networks:
  erp-network:
    external: true
