services:
  log-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_PROJECT_NAME:-erp-suite}-log-service
    privileged: true
    ports:
      - "8092:8092"
      - "8093:8093"
      - "3004:3004"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8092
      DOCKER_SOCKET: unix:///var/run/docker.sock
      DOCKER_HOST: unix:///var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - erp-network
    profiles:
      - full-stack

networks:
  erp-network:
    external: true
